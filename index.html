<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>성장 기록 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 사내 관리 사이트 안의 한 페이지. 상단 바(경로·연도·역할 전환) + 본문 1열, 리뷰 화면만 2열 */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --sunk:#eef1ef; --ink:#18211f; --muted:#5a6763; --line:#dce2df;
  --accent:#1d5c57; --accent-ink:#ffffff; --accent-soft:#e1eeec;
  --stamp:#c0392b; --manner:#2b58a0; --attitude:#2c7a4c;
  --ok:#2c7a4c; --ok-soft:#e2f2e8; --warn:#a8691a; --warn-soft:#fbf0dd; --crit:#bf3a2c; --crit-soft:#fbe5e2; --info:#2b58a0; --info-soft:#e3ebf8;
  --font:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111716; --surface:#192120; --sunk:#141b1a; --ink:#e5ebe9; --muted:#9aa8a4; --line:#2a3432;
  --accent:#6dbcb3; --accent-ink:#0d1716; --accent-soft:#1c3230; --stamp:#e3705f; --manner:#82a8e8; --attitude:#62c08a;
  --ok:#62c08a; --ok-soft:#173022; --warn:#e2ac55; --warn-soft:#33270f; --crit:#e3705f; --crit-soft:#3a1c18; --info:#82a8e8; --info-soft:#1a2740;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111716; --surface:#192120; --sunk:#141b1a; --ink:#e5ebe9; --muted:#9aa8a4; --line:#2a3432;
  --accent:#6dbcb3; --accent-ink:#0d1716; --accent-soft:#1c3230; --stamp:#e3705f; --manner:#82a8e8; --attitude:#62c08a;
  --ok:#62c08a; --ok-soft:#173022; --warn:#e2ac55; --warn-soft:#33270f; --crit:#e3705f; --crit-soft:#3a1c18; --info:#82a8e8; --info-soft:#1a2740;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.crumb b{color:var(--ink);font-weight:600;font-size:15px}
.proto{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:2px 7px;border:1px dashed var(--warn);color:var(--warn);border-radius:4px}
.top-right{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select.year{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-width:100%}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

main{padding-block:24px 64px;display:grid;gap:24px}
.eyebrow{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:16px}
.panel-b{padding:18px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.muted{background:var(--sunk);color:var(--muted)}
.hex{display:inline-grid;place-items:center;width:22px;height:24px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.stamp{position:absolute;right:12px;bottom:10px;width:48px;height:48px;border:2px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-content:center;text-align:center;font-weight:700;font-size:12px;line-height:1.1;transform:rotate(-12deg);opacity:.85}
.stamp small{display:block;font-size:9.5px;font-weight:500}
.src{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.src.auto{color:var(--accent);border-color:var(--accent)}

.person{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.person h1{font-size:24px}
.person h1 span{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0}
.stats div{display:grid;gap:2px}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stats dd small{font-size:12px;font-weight:500;color:var(--muted)}

.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--mono);font-size:12px;margin-left:4px}

.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.timeline{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qcard{position:relative;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;min-height:132px;align-content:start}
.qcard:hover{border-color:var(--muted)}
.qcard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qlabel{font-family:var(--mono);font-weight:500;font-size:18px}
.qnow{font-size:11px;color:var(--accent);font-weight:600;margin-left:6px;font-family:var(--font)}
.qdates{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qmeta{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.qmeta b{color:var(--ink);font-weight:600}

.form{display:grid;gap:28px}
.fs{display:grid;gap:16px;border:0;padding:0;margin:0;min-width:0}
.fs-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.fs-h h3{font-size:15px}
.field{display:grid;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select.in,textarea{width:100%;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px}
textarea{min-height:76px;resize:vertical;line-height:1.55}
input[type=number]{width:90px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.row > .field{flex:1 1 200px}
.range{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.range input[type=date]{width:auto;flex:1 1 140px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.mission{border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:16px;display:grid;gap:14px;min-width:0}
.mission-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.mission-h h4{margin:0;font-size:14px}
.mission-h .spacer{flex:1}
.add-row{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.val{display:grid;gap:4px;font-size:13px;border-radius:6px;padding:12px 14px}
.val:empty{display:none}
.val.has-err{background:var(--crit-soft);color:var(--crit)}
.val.only-warn{background:var(--warn-soft);color:var(--warn)}
.val.ok{background:var(--ok-soft);color:var(--ok)}
.val p{margin:0}
.notice{border-radius:6px;padding:12px 14px;font-size:13px;display:grid;gap:4px}
.notice.crit{background:var(--crit-soft);color:var(--crit)}
.notice.info{background:var(--info-soft);color:var(--info)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}

.read{display:grid;gap:22px}
.qa{display:grid;gap:14px;margin:0}
.qa dt{font-size:12.5px;font-weight:600;color:var(--muted)}
.qa dd{margin:2px 0 0;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap;min-width:0}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}
.review-box{border-left:3px solid var(--accent);padding:4px 0 4px 14px;display:grid;gap:10px}
.docs{display:flex;flex-wrap:wrap;gap:8px}
.doc{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:4px 9px;background:var(--sunk)}
.doc b{font-family:var(--font);font-weight:600;margin-right:6px}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.wide-tbl{min-width:860px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.name b{display:block}
td.name span{font-size:12px;color:var(--muted)}
.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;cursor:pointer;text-align:left}
.cell:hover{border-color:var(--line);background:var(--sunk)}
.cell small{font-size:11.5px;color:var(--muted)}
.cell small.flag{color:var(--warn);font-weight:600}
.cell.dim{opacity:.35}
td.total{font-weight:600;font-variant-numeric:tabular-nums}
.sep{border-left:1px solid var(--line)}

.rv-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rv-bar h1{font-size:20px}
.rv-bar .spacer{flex:1}
.rv-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media (max-width:920px){.rv-grid{grid-template-columns:1fr}}
.rv-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:920px){.rv-side{position:static}}
.radios{display:grid;gap:6px}
.radios label{display:flex;gap:8px;align-items:center;font-weight:400;font-size:13.5px;cursor:pointer}
.grant{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
.grant:last-child{border-bottom:0}
.grant select{width:auto}
.guide{background:var(--sunk);border-radius:6px;padding:10px 12px;font-size:12.5px;display:grid;gap:2px}
.guide b{font-size:13px}

/* F=ma */
.fma-head{display:flex;flex-wrap:wrap;gap:18px 40px;align-items:center}
.fma-total{display:flex;align-items:baseline;gap:6px}
.fma-total b{font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.fma-total span{color:var(--muted);font-size:15px}
.meter{position:relative;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden;min-width:200px;flex:1}
.meter i{position:absolute;top:0;bottom:0;left:0}
.meter .m{background:var(--manner)} .meter .a{background:var(--attitude)}
.meter-wrap{flex:1 1 280px;display:grid;gap:6px;min-width:0}
.meter-mark{position:relative;height:14px;font-size:11px;color:var(--muted)}
.meter-mark span{position:absolute;transform:translateX(-50%);font-family:var(--mono)}
.band{display:grid;gap:4px;font-size:13px}
.fma-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:900px){.fma-grid{grid-template-columns:1fr}}
.fma-grid h2 .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0}
.items .lbl{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-weight:600;font-size:13.5px}
.items .crit{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.items .val{padding:0;font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;display:block;background:none}
.items .sc{font-weight:700;font-size:15px;text-align:right;min-width:52px;font-variant-numeric:tabular-nums}
.items .sc.neg{color:var(--crit)} .items .sc.zero{color:var(--muted);font-weight:500}
.pace{grid-column:1/-1;position:relative;height:4px;border-radius:2px;background:var(--sunk)}
.pace i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--muted);opacity:.55}
.pace u{position:absolute;top:-3px;width:2px;height:10px;background:var(--ink)}
.subtot{display:flex;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);font-weight:600}

/* level-up */
.lv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.lv-grid{grid-template-columns:1fr}}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start}
.checks .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.checks .ic.y{background:var(--ok-soft);color:var(--ok)} .checks .ic.n{background:var(--crit-soft);color:var(--crit)}
.checks b{display:block}
.checks .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ledger{width:100%;font-size:13px}
.ledger td{padding:6px 0;border-bottom:1px dashed var(--line)}
.ledger td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.ledger tr.sum td{border-bottom:0;font-weight:700;border-top:1px solid var(--ink);padding-top:8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0}
.steps li{flex:1 1 110px;display:grid;gap:4px;padding:10px 12px 10px 0;position:relative;font-size:12.5px;min-width:0}
.steps li::before{content:"";height:4px;border-radius:2px;background:var(--line);margin-bottom:4px}
.steps li.done::before{background:var(--ok)} .steps li.cur::before{background:var(--info)} .steps li.fail::before{background:var(--crit)}
.steps li b{font-size:13px}
.sched{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;font-size:11px;text-align:center}
.sched div{padding:6px 0;background:var(--sunk);border-radius:3px;color:var(--muted);font-family:var(--mono)}
.sched div.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sched div.now{outline:2px solid var(--ink);outline-offset:-2px}
.sched-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;font-size:12.5px;margin:10px 0 0;padding:0;list-style:none}
.sched-legend b{font-family:var(--mono);font-weight:500;color:var(--accent);margin-right:6px}

.admin-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.admin-grid{grid-template-columns:1fr}}
.admin-grid .wide{grid-column:1/-1}
.qset{display:grid;gap:8px}
.qset .r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.qset .r span.q{font-family:var(--mono);width:28px}
.qset input{width:auto;flex:1 1 130px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);min-width:120px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.copybox{width:100%;min-height:120px;font-family:var(--mono);font-size:12px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.log li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px}
.inputs .field label{font-weight:500;font-size:12.5px}
.inputs input[type=number]{width:100%}
.queue{display:grid;gap:14px}
.qitem{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--sunk);min-width:0}
.qitem-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.qitem-h b{font-size:14px}
.empty{color:var(--muted);font-size:13px;margin:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:20}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="crumb">one <span aria-hidden="true">›</span> 인사 <span aria-hidden="true">›</span> <b>성장 기록</b> <span class="proto">PROTOTYPE · 예시 데이터</span></div>

function dstatus(r, qi){ return (r.status === 'draft' && Q(qi).end < TODAY) ? 'missing' : r.status; }
const pill = st => `<span class="pill ${STATUS[st][1]}">${STATUS[st][0]}</span>`;

function granted(r){
  if (r.status !== 'done' || !r.review?.grants) return 0;
  if (r.objection?.status === 'resolved') return Number(r.objection.final);
  return Object.values(r.review.grants).reduce((a,b)=>a+Number(b),0);

function commonUsedElsewhere(mid, qi){

/* ---------- F=ma ---------- */
function fmaValue(mid, it){
  const rs = S.records[mid], doneRs = rs.filter(r=>r.status==='done');
  if (it.k === 'oneOnOne') return doneRs.length;
  if (it.k === 'tf') return doneRs.reduce((a,r)=>a+(Number(r.one.tfCount)||0),0);
  if (it.k === 'collab') return doneRs.reduce((a,r)=>a+(Number(r.one.collabCount)||0),0);
  return S.fma[mid][it.k];
}
function fmaScore(mid, it, v){
  if (it.bool) return v ? 10 : 0;
  if (v === '' || v === null || v === undefined) return 0;
  v = Number(v);
  if (it.tiers){ for (const [th, sc] of it.tiers) if (v >= th) return sc; return it.floor; }
  if (it.direct) return v;
  if (it.k === 'retro') return v*10 + (Number(S.fma[mid].retroExec)||0)*5;
  let s = v * it.per; if (it.floorDec) s = Math.floor(s); if (it.max) s = Math.min(s, it.max); return s;
}
function fmaCalc(mid){
  const out = {};
  for (const g of ['manner','attitude']){
    out[g] = FMA[g].items.map(it => { const v = fmaValue(mid, it); return {it, v, sc:fmaScore(mid, it, v)}; });
    out[g+'Sum'] = out[g].reduce((a,x)=>a+x.sc,0);
  }
  out.total = out.mannerSum + out.attitudeSum;
  out.band = FMA_BANDS.find(b => out.total >= b.min);
  return out;
}
function luCheck(mid){
  const f = fmaCalc(mid), b = badgeLedger(mid), ones = S.records[mid].filter(r=>r.status==='done').length;
  return {f, b, ones, fmaOk:f.total>=100, badgeOk:b.held>=b.req, ok:f.total>=100 && b.held>=b.req};
}
const luSteps = mid => lvOf(mid) >= 4 ? LU_STEPS.high : LU_STEPS.low;

/* ---------- validation ---------- */
function validateMember(mid, qi){
  const r = rec(mid, qi), q = Q(qi), errs = [], warns = [];
  ONE.filter(o=>o.req).forEach(o => { if (!String(r.one[o.k]||'').trim()) errs.push(`1on1 카드: ‘${o.label}’ 항목이 비어 있습니다.`); });
  if (!r.one.meetReq) warns.push('1on1 희망일을 입력하면 팀장에게 일정 요청이 함께 전달됩니다.');
  const commons = r.missions.filter(m=>m.type==='common');
  if (commons.length > 1) errs.push('누구나 수행 가능한 미션은 연 1회만 신청할 수 있습니다.');
  if (commons.length){ const u = commonUsedElsewhere(mid, qi); if (u !== null) errs.push(`누구나 수행 가능한 미션은 연 1회입니다. 이미 Q${u+1}에 신청했습니다.`); }
  r.missions.forEach((m, i) => {
    const t = MT[m.type], name = `${t.short} 미션 ${i+1}`;
    t.fields.forEach(f => {
      if (f.special){ if (m.badges >= 2 && !String(m.f.special||'').trim()) errs.push(`${name}: 배지 2개 이상 신청 시 ‘특별 성과 근거’가 필요합니다.`); return; }
      if (f.opt) return;
      const v = m.f[f.k];
      if (f.type === 'range'){ if (!m.f.start || (!m.f.end && !m.f.ongoing)) errs.push(`${name}: ‘${f.label}’을 입력해 주세요.`); return; }
      if (f.type === 'chips'){ if (!(v||[]).length) errs.push(`${name}: ‘${f.label}’을 하나 이상 선택해 주세요.`); return; }
      if (!String(v||'').trim()) errs.push(`${name}: ‘${f.label}’ 항목이 비어 있습니다.`);
    });
    if (m.f.start && m.f.start > q.end) warns.push(`${name}: 시작일이 Q${qi+1} 종료일(${ymd(q.end)}) 이후입니다.`);
    if (m.f.end && !m.f.ongoing && m.f.end < q.start) warns.push(`${name}: 종료일이 Q${qi+1} 시작일(${ymd(q.start)}) 이전입니다.`);
    if (m.type === 'common' && m.f.date && (m.f.date < q.start || m.f.date > q.end)) warns.push(`${name}: 취득일이 Q${qi+1} 기간 밖입니다.`);
    if (m.f.result && !/\d/.test(m.f.result)) warns.push(`${name}: 결과 지표에 수치가 없습니다. 건수, 비율, 단축 기간을 넣으면 리뷰에서 근거로 인정받기 쉽습니다.`);
  });
  return {errs, warns};
}
function renderVal(v, okMsg, id='val'){
  if (!v.errs.length && !v.warns.length) return okMsg ? `<div class="val ok" id="${id}"><p>${okMsg}</p></div>` : `<div id="${id}"></div>`;
  const cls = v.errs.length ? 'has-err' : 'only-warn';

  } else {
    const msg = { done:'리뷰가 완료된 기록입니다.', rejected:'반려되어 구성원이 다시 작성 중입니다.', draft:'구성원이 아직 제출하지 않았습니다.', missing:'분기가 지났지만 제출되지 않았습니다.' }[d];

function validateReview(r){
  const errs = [];
  const quant = ($('#rv-quant')?.value || '').trim();
  const expect = document.querySelector('input[name="rv-expect"]:checked')?.value;
  const fb = $('#rv-feedback').value.trim();
  const grants = {}; r.missions.forEach(m => grants[m.id] = Number($('#g-'+m.id).value));
  const total = Object.values(grants).reduce((a,b)=>a+b,0);
  if (!expect) errs.push('레벨 대비 기대 역할 충족 여부를 선택해 주세요.');
  if (!fb) errs.push('리더의 피드백을 작성해 주세요.');
  if (total > 0 && !/\d/.test(quant)) errs.push('성과의 정량 근거에 확인한 수치를 적어 주세요. 정성 코멘트만 있으면 근거 부족으로 처리됩니다.');
  r.missions.forEach(m => { if (grants[m.id] >= 2 && !String(m.f.special||'').trim()) errs.push(`${MT[m.type].short} 미션: 2개 이상 부여에는 구성원의 특별 성과 근거가 필요합니다.`); });
  return {errs, quant, expect, fb, grants, total};
}

function findMission(id){ const r = rec(ME, UI.memberQ); return r.missions.find(m=>m.id===id); }
function luAdvance(mid, by){
  const lu = S.levelup[mid], steps = luSteps(mid);
  lu.history.push({step:steps[lu.stage], at:TODAY, by});
  lu.stage++;
  if (lu.stage >= steps.length - 1){
    lu.history.push({step:steps[steps.length-1], at:TODAY, by:'HR'});
    lu.status = 'done';
    const b = badgeLedger(mid), p = S.people[mid];
    p.carry = Math.max(0, b.held - b.req); p.bonus = 0; p.used = yearGranted(mid); p.lv = lu.target; p.years = 0;
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.role){ UI.role = d.role; UI.review = null; render(); scrollTo(0,0); return; }
  if (d.mtab){ UI.mtab = d.mtab; render(); return; }
  if (d.q){ UI.memberQ = Number(d.q); UI.objOpen = false; render(); return; }
  if (d.filter){ UI.filter = d.filter; render(); return; }
  if (d.review){ const [mid, qi] = d.review.split(':'); UI.review = [mid, Number(qi)]; render(); scrollTo(0,0); return; }
  if (d.add){ const r = rec(ME, UI.memberQ); const m = M(d.add, 1, d.add==='job' ? {tier:'본인 레벨 미션 클리어 (1개)'} : {}); r.missions.push(m); save(); render(); return; }
  if (d.del){ const r = rec(ME, UI.memberQ); r.missions = r.missions.filter(m=>m.id!==d.del); save(); render(); return; }
  if (d.chip){ const m = findMission(d.m); const arr = m.f[d.k] = m.f[d.k] || [];
    const i = arr.indexOf(d.chip); i>=0 ? arr.splice(i,1) : arr.push(d.chip);
    t.setAttribute('aria-pressed', i<0); save(); refreshVal(); return; }
  if (d.luApprove || d.luReject){
    const mid = d.luApprove || d.luReject, lu = S.levelup[mid], fb = $('#lufb-'+mid).value.trim();
    if (!fb){ toast('리더 피드백을 작성해 주세요.'); $('#lufb-'+mid).focus(); return; }
    lu.leaderFb = fb;
    if (d.luApprove){ luAdvance(mid, LEADER); toast(`${member(mid).name} 레벨업 신청을 승인했습니다. HR 검증으로 넘어갑니다.`); }
    else { lu.status = 'rejected'; lu.history.push({step:'팀장 반려', at:TODAY, by:LEADER}); toast(`${member(mid).name} 레벨업 신청을 반려했습니다.`); }
    save(); render(); return; }
  if (d.luAdvance){ const mid = d.luAdvance, steps = luSteps(mid), st = steps[S.levelup[mid].stage]; luAdvance(mid, '이민철');
    const lu = S.levelup[mid]; save(); render();
    toast(lu.status==='done' ? `${member(mid).name} L${lu.target} 레벨업이 확정되어 개별 공지했습니다.` : `‘${st}’ 단계를 완료했습니다.`); return; }
  if (d.luFail){ const mid = d.luFail, reason = $('#luhr-'+mid).value.trim();
    if (!reason){ toast('탈락 사유를 입력해 주세요. 신청자와 팀장에게 피드백됩니다.'); return; }
    const lu = S.levelup[mid]; lu.status = 'failed'; lu.reason = reason; save(); render(); toast('탈락 처리하고 사유를 통보했습니다.'); return; }
  if (d.objDecide){ const [mid, qi] = d.objDecide.split(':'), r = rec(mid, Number(qi));
    const key = d.objDecide; const final = Number(document.getElementById('obj-final-'+key).value), note = document.getElementById('obj-note-'+key).value.trim();
    if (!note){ toast('결정 사유를 입력해 주세요.'); return; }
    Object.assign(r.objection, {status:'resolved', final, note, decidedAt:TODAY}); save(); render();
    toast(`${member(mid).name} Q${Number(qi)+1} 최종 배지 ${final}개로 결정해 통보했습니다.`); return; }

  const act = d.act;
  if (act === 'draft'){ save(); toast('임시저장했습니다.'); return; }
  if (act === 'submit'){
    const v = validateMember(ME, UI.memberQ);
    if (v.errs.length){ refreshVal(); $('#val').scrollIntoView({block:'center', behavior:'smooth'}); toast(`제출 전에 ${v.errs.length}개 항목을 확인해 주세요.`); return; }
    const r = rec(ME, UI.memberQ); r.status = 'submitted'; r.review = null; save(); render();
    toast(`Q${UI.memberQ+1} 기록을 제출했습니다. ${LEADER} 팀장에게 리뷰와 1on1 일정 요청이 전달됩니다.`); return; }
  if (act === 'obj-open'){ UI.objOpen = true; render(); $('#obj-disagree')?.focus(); return; }
  if (act === 'obj-cancel'){ UI.objOpen = false; render(); return; }
  if (act === 'obj-submit'){
    const dis = $('#obj-disagree').value.trim();
    if (!dis){ $('#objval').outerHTML = renderVal({errs:['리더와 이견이 있는 내용을 작성해 주세요.'],warns:[]},'','objval'); return; }
    rec(ME, UI.memberQ).objection = {status:'pending', at:TODAY, disagree:dis, toCommittee:$('#obj-committee').value.trim()};
    UI.objOpen = false; save(); render(); toast('배지위원회에 이의 신청을 접수했습니다.'); return; }
  if (act === 'lu-save'){ save(); toast('레벨업 신청서를 임시저장했습니다.'); return; }
  if (act === 'lu-submit'){
    const lu = S.levelup[ME];
    if (!String(lu.essay1||'').trim() || !String(lu.essay2||'').trim()){ $('#luval').outerHTML = renderVal({errs:['신청서의 두 항목을 모두 작성해 주세요.'],warns:[]},'','luval'); return; }
    Object.assign(lu, {status:'progress', stage:1, target:lvOf(ME)+1, at:TODAY, leaderFb:''});
    lu.history = [{step:'신청', at:TODAY, by:member(ME).name}];
    save(); render(); toast(`레벨업을 신청했습니다. ${LEADER} 팀장 승인 후 HR 검증으로 넘어갑니다.`); return; }
  if (act === 'back'){ UI.review = null; render(); return; }
  if (act === 'approve' || act === 'reject'){
    const [mid, qi] = UI.review, r = rec(mid, qi), m = member(mid);
    if (act === 'reject'){
      const reason = $('#rv-reject').value.trim();
      if (!reason){ $('#rval').outerHTML = renderVal({errs:['반려 사유를 작성해 주세요. 구성원에게 그대로 전달됩니다.'],warns:[]},'','rval'); return; }
      r.status = 'rejected'; r.review = {rejectReason:reason, at:TODAY}; save();
      toast(`${m.name} Q${qi+1} 기록을 반려했습니다.`);
    } else {
      const v = validateReview(r);
      if (v.errs.length){ $('#rval').outerHTML = renderVal({errs:v.errs,warns:[]},'','rval'); return; }
      const before = luCheck(mid).ok;
      const no = `FO6-2026-${String(++S.seq).padStart(4,'0')}`;
      r.status = 'done';
      r.review = {meet:$('#rv-meet').value, quant:v.quant, expect:v.expect, feedback:v.fb, grants:v.grants, at:TODAY};
      r.gw = [{kind:'1on1 미팅 카드', no:no+'-1'}]; if (r.missions.length) r.gw.push({kind:'배지 신청서', no:no+'-2'});
      save();
      const nowOk = luCheck(mid).ok;
      toast(`승인했습니다. 배지 ${v.total}개 부여, 결재 문서 ${r.gw.length}건 생성.${!before && nowOk ? ` ${m.name}님이 레벨업 기준을 충족했습니다.` : ''}`);
    }
    const next = pendingList()[0]; UI.review = next ? next : null; render(); scrollTo(0,0); return; }
  if (act === 'copy'){
    const tsv = exportTSV();
    const fallback = () => { $('#copyfb').hidden = false; const b = $('#copybox'); b.value = tsv; b.focus(); b.select(); };
    try { navigator.clipboard.writeText(tsv).then(()=>toast('표를 복사했습니다. 엑셀에 붙여넣으세요.'), fallback); } catch(err){ fallback(); }
    return; }
  if (act === 'reset'){ S = seed(); save(); UI.memberQ = 3; UI.objOpen = false; render(); toast('예시 데이터로 되돌렸습니다.'); return; }
});

document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.one){ const r = rec(ME, UI.memberQ); r.one[d.one] = t.type==='number' ? Number(t.value)||0 : t.value; save(); refreshVal(); return; }
  if (d.lu){ S.levelup[ME][d.lu] = t.value; save(); return; }
  if (d.m && d.k && !d.chip){ const m = findMission(d.m); if (!m) return;
    if (t.type === 'checkbox'){ m.f[d.k] = t.checked; const end = $('#'+m.id+'-end'); if (end) end.disabled = t.checked; }
    else m.f[d.k] = t.value;
    if (d.k === 'tier'){ m.badges = tierBadges(m); save(); render(); return; }
    save(); refreshVal(); return; }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.badges){ const m = findMission(d.badges); m.badges = Number(t.value); save(); render(); return; }
  if (d.qs !== undefined || d.qe !== undefined){ const qi = Number(d.qs ?? d.qe); S.settings.quarters[qi][d.qs!==undefined?'start':'end'] = t.value; save(); render(); return; }
  if (t.id === 'fma-member'){ UI.fmaMember = t.value; render(); return; }
  if (d.fma){ const raw = S.fma[UI.fmaMember]; raw[d.fma] = t.type==='checkbox' ? t.checked : (t.value==='' ? '' : Number(t.value)); save(); render(); return; }
});

render();
</script>

</body></html>
